<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code-to-Video 评测</title>
<style>
:root{
  --bg:#f6f5f1; --card:#fff; --ink:#1c1f24; --ink2:#4b515a; --mute:#8c877e; --line:#e2ded5; --line2:#efece6;
  --acc:#264b6e; --acc-soft:#e7eef5;
  --an:#c4613b; --oa:#1e7a62; --ds:#2c5a8c; --A:#cf7a2b; --B:#3a6ea8;
  --ok:#2e7b4e; --ok-s:#e3f1e8; --bad:#b23a2a; --bad-s:#fbebe8; --warn:#9c6510; --warn-s:#fcf1dc;
  --mono:"SF Mono",Menlo,Consolas,monospace; --top:56px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
a{color:var(--acc);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
kbd{font-family:var(--mono);font-size:11px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:#fff;color:var(--ink2)}
.mono{font-family:var(--mono)}
.muted{color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;line-height:20px;padding:0 8px;border-radius:10px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-s);color:var(--ok)}.chip.bad{background:var(--bad-s);color:var(--bad)}.chip.warn{background:var(--warn-s);color:var(--warn)}.chip.going{background:#fff1d8;color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:16px;padding:0 22px;background:rgba(246,245,241,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15.5px;white-space:nowrap}
nav.tabs{display:flex;gap:2px;background:#ebe8e0;border-radius:9px;padding:3px}
nav.tabs a{padding:5px 15px;border-radius:7px;color:var(--ink2);font-size:13.5px;white-space:nowrap}
nav.tabs a.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grow{flex:1}
.status{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.live{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);white-space:nowrap}
.live .dot{background:#bbb}.live.on .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(46,123,78,.18)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c1f24;color:#fff;font-size:13px;padding:8px 14px;border-radius:8px;display:none;align-items:center;gap:12px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.on{display:flex}.toast button{color:#9fd3ff;font-weight:600}

main{padding:20px 22px 80px;max-width:1720px;margin:0 auto}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg a{padding:5px 12px;font-size:13px;color:var(--ink2);border-right:1px solid var(--line)}
.seg a:last-child{border-right:0}.seg a.on{background:var(--ink);color:#fff}

/* ---------- overview ---------- */
.qsec{margin-bottom:26px}
details.qsec>summary{list-style:none;cursor:pointer}
details.qsec>summary::-webkit-details-marker{display:none}
details.qsec>summary .qhead h2::before{content:"▸";display:inline-block;width:16px;color:var(--mute);transition:transform .15s}
details.qsec[open]>summary .qhead h2::before{transform:rotate(90deg)}
details.qsec:not([open]){margin-bottom:10px;opacity:.75}
.qhead .fold{font-size:12px;color:var(--mute)}
.qhead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.qhead h2{margin:0;font-size:17px}
.qhead .lv{font-size:12px;color:var(--mute)}
.qhead a.cmp{margin-left:auto;font-size:12.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s;color:inherit}
.card:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-1px)}
.thumb{position:relative;aspect-ratio:16/9;background:#15171b;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .bar2{position:absolute;left:0;bottom:0;height:3px;background:#fff;width:0;opacity:.9}
.thumb .wait{color:#a2a8b0;font-size:12.5px;text-align:center;line-height:1.8}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.cbody{padding:9px 11px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cbody>*{min-width:0}
.who span:not(.dot):not(.cond){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;white-space:nowrap;min-width:0}
.who .cond{font-weight:400;font-size:12px;color:var(--mute);margin-left:auto;flex:none}
.stats{display:flex;gap:12px;font-size:12px;color:var(--mute)}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:5px;flex-wrap:wrap}

/* ---------- compare ---------- */
.pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;width:22px;height:22px;border-radius:6px;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.tag.A{background:var(--A)}.tag.B{background:var(--B)}
.swap{border:1px solid var(--line);border-radius:7px;padding:4px 10px;background:#fff}
.presets{display:flex;gap:5px;flex-wrap:wrap;font-size:12px;color:var(--mute);align-items:center}
.presets a{font-size:12px;padding:2px 9px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink2)}
.presets a:hover{border-color:var(--ink2)}
.tally{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.tally b{font-size:16px;font-variant-numeric:tabular-nums}
.syncbar{display:flex;gap:8px;align-items:center;margin-left:auto}
.syncbar button{border:1px solid var(--line);border-radius:7px;padding:4px 11px;background:#fff;font-size:12.5px}
.syncbar button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.syncbar input{width:200px}
.row{display:grid;grid-template-columns:150px 1fr 1fr;gap:14px;margin-bottom:16px;align-items:start}
.row.many{grid-template-columns:1fr}
.rowh h3{margin:0;font-size:15px}.rowh .lv{font-size:12px;color:var(--mute)}
.vote{display:flex;gap:5px;margin-top:10px}
.vote button{flex:1;padding:5px 0;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12.5px;color:var(--ink2)}
.vote button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.vbox{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-self:start}
.vbox .vh{display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line2)}
.vbox .vh .cond{font-weight:400;font-size:12px;color:var(--mute);margin-left:auto}
.vbox video{display:block;width:100%;background:#15171b;max-height:60vh}
.vbox .none{aspect-ratio:16/9;max-height:42vh;width:100%;background:#15171b;color:#a2a8b0;display:flex;align-items:center;justify-content:center;font-size:12.5px}
.vbox .vf{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:8px 11px;font-size:12px;color:var(--mute);border-top:1px solid var(--line2)}
.vbox .vf b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.vbox .vf b.win{color:var(--ok)}
.vbox .vf a{margin-left:auto}
.grid-all{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}

/* ---------- run detail ---------- */
.rv{display:grid;grid-template-columns:minmax(440px,45%) 1fr;gap:0;height:calc(100vh - var(--top));margin:-20px -22px -80px}
.rl{overflow:auto;padding:16px 20px 40px;background:#fff;border-right:1px solid var(--line)}
.rr{display:flex;flex-direction:column;min-height:0}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:13px}
.crumb a.back{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink2)}
.crumb h2{margin:0;font-size:17px;flex-basis:100%}
.crumb .nav{margin-left:auto;display:flex;gap:6px}
.crumb .nav a{padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink2);font-size:12.5px}
.player video{display:block;width:100%;border-radius:8px;background:#15171b;max-height:50vh}
.player .none{aspect-ratio:16/9;border-radius:8px;background:#15171b;color:#a2a8b0;display:flex;align-items:center;justify-content:center}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:6px}
.strip button{border-radius:3px;overflow:hidden;outline:2px solid transparent;outline-offset:-2px;position:relative}
.strip button.cur{outline-color:var(--acc)}
.strip img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#222}
.strip span{position:absolute;left:3px;bottom:1px;font-size:9.5px;color:#fff;text-shadow:0 0 3px #000}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 10px}
.fact{background:var(--bg);border-radius:8px;padding:8px 10px}
.fact .l{font-size:11.5px;color:var(--mute)}.fact .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}.fact .s{font-size:11.5px;color:var(--ink2)}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:4px 0 6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
details.sec{border-top:1px solid var(--line2);padding:10px 0 0;margin-top:12px}
details.sec summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);list-style:none;display:flex;justify-content:space-between}
details.sec summary::after{content:"展开";font-weight:400;color:var(--mute);font-size:12px}
details.sec[open] summary::after{content:"收起"}
details.sec pre{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;background:var(--bg);padding:10px 12px;border-radius:7px;margin:8px 0 0;max-height:320px;overflow:auto}
.sibs{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.sibs a{font-size:12px;padding:2px 9px;border:1px solid var(--line);border-radius:11px;color:var(--ink2);background:#fff;display:inline-flex;align-items:center;gap:5px}
.sibs a.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
.finding{font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line2)}
.finding code{font-family:var(--mono);font-size:11.5px;background:var(--bg);padding:0 4px;border-radius:3px}
.sev{font-size:11px;padding:0 6px;border-radius:4px;margin-right:5px}
.sev.error{background:var(--bad-s);color:var(--bad)}.sev.warning{background:var(--warn-s);color:var(--warn)}.sev.info{background:var(--line2);color:var(--mute)}

.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.tbar .f{display:flex;gap:4px;flex-wrap:wrap}
.tbar .f button{font-size:12.5px;padding:3px 10px;border:1px solid var(--line);border-radius:13px;color:var(--ink2);background:#fff}
.tbar .f button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbar input{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:7px;width:190px}
.tbar .cnt{margin-left:auto;font-size:12px;color:var(--mute)}
.tbar .xp{font-size:12px;color:var(--acc)}
.mm{display:flex;gap:1px;height:18px;padding:5px 16px;background:#fff;border-bottom:1px solid var(--line)}
.mm i{flex:1;min-width:2px;border-radius:1px;cursor:pointer;opacity:.85}
.mm i:hover{opacity:1;transform:scaleY(1.35)}
.trace{flex:1;overflow:auto;padding:12px 16px 80px;background:var(--bg)}
.loading{padding:40px;text-align:center;color:var(--mute)}
.st{display:grid;grid-template-columns:38px 1fr;gap:8px;margin-bottom:6px}
.st .ix{font-size:11px;color:var(--mute);text-align:right;padding-top:8px;font-variant-numeric:tabular-nums}
.st .bd{background:#fff;border:1px solid var(--line);border-left:3px solid var(--c,#999);border-radius:7px;padding:7px 11px;min-width:0}
.st.think .bd{background:transparent;border:0;border-left:2px dashed #c8c3b8;border-radius:0;color:#6c675f;font-style:italic;padding:2px 11px}
.st.say .bd{border-left-color:var(--acc);background:var(--acc-soft)}
.st.final .bd{border-left-color:var(--ok);background:var(--ok-s)}
.st.err .bd{background:var(--bad-s)}
.st.hit .bd{box-shadow:0 0 0 2px #f0c53f}
.st .hd{display:flex;gap:8px;align-items:baseline;min-width:0;cursor:pointer}
.st .tg{font-size:11px;font-weight:700;color:var(--c);letter-spacing:.03em;white-space:nowrap}
.st .ar{font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:4.8em;overflow:hidden;flex:1;min-width:0}
.st.open .ar{max-height:none}
.st .tx{white-space:pre-wrap;word-break:break-word}
.st .more{font-size:11.5px;color:var(--acc);margin-top:4px;cursor:pointer;display:inline-block}
.st pre.out{display:none;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11.5px;background:#f5f4ef;border-radius:6px;padding:8px 10px;margin:6px 0 0;max-height:440px;overflow:auto;color:#3a3f46}
.st.open pre.out{display:block}
.st img.seen{display:block;max-width:min(100%,440px);margin-top:7px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.lb{position:fixed;inset:0;background:rgba(10,12,15,.9);display:none;align-items:center;justify-content:center;z-index:70;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:94vw;max-height:94vh;border-radius:6px}
.empty{padding:60px 20px;text-align:center;color:var(--mute)}
@media (max-width:1100px){.rv{grid-template-columns:1fr;height:auto}.rr{height:85vh}.row{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <div class="brand">Code-to-Video 评测</div>
  <span class="seg" id="roundSeg"><a href="../r1/" data-r="r1">第一轮</a><a href="../r2/" data-r="r2">第二轮</a></span>
  <nav class="tabs" id="tabs"><a data-v="overview">总览</a><a data-v="compare">对比</a><a data-v="run">单次运行</a></nav>
  <div class="grow"></div>
  <span class="status" id="status"></span>
  <button class="live on" id="live" title="每 60 秒检查新数据"><span class="dot"></span>自动刷新</button>
</header>
<main id="app"><div class="empty">加载中…</div></main>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn">更新</button></div>
<div class="lb" id="lb"><img alt=""></div>

<script>
/* ===== state & data ===== */
let META = null, RUNS = [], BYID = {};
const TRACE = {};                 // id -> {rev, steps, prompt}
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FAM = {anthropic:'var(--an)', openai:'var(--oa)', deepseek:'var(--ds)'};
const KIND = {shell:['#5b6470','命令'], edit:['#8a5cc7','写文件'], read:['#3d8bd0','读取'], view:['#d08a2a','看图'], skill:['#2f9e8f','Skill'], err:['#b23a2a','报错']};
const store = {
  get votes(){ return JSON.parse(localStorage.c2vVotes || '{}'); },
  set votes(v){ localStorage.c2vVotes = JSON.stringify(v); },
};
const fmtT = s => s == null ? '–' : s >= 3600 ? (s/3600).toFixed(1)+' 小时' : s >= 60 ? (s/60).toFixed(1)+' 分' : s+' 秒';
const fmtK = n => !n ? '–' : n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? Math.round(n/1e3)+'k' : String(n);
const agents = () => Object.keys(META.agents);
const qids = () => Object.keys(META.queries);
const label = r => `${META.agents[r.agent].model} · ${META.conds[r.cond]}`;
const isPortrait = r => r.video && r.video.h > r.video.w;
const costOf = r => { const u = r.usage || {}; return u.cost_usd != null ? '$' + u.cost_usd.toFixed(2) : fmtK(u.in); };
const costName = r => (r.usage || {}).cost_usd != null ? '成本' : '输入';
function state(r){ return !r.done ? ['going','运行中'] : r.media ? ['ok','已出片'] : ['bad','无成品']; }
const askText = Q => Q.ask ? `要求 ${Q.ask} 秒` : '未限时长';
function durChip(r){
  if (!r.video) return '';
  const ask = META.queries[r.q].ask, d = r.video.dur, off = ask ? Math.abs(d - ask) / ask : 0;
  return `<span class="chip ${off > .15 ? 'warn' : ''}">${d}s${off > .15 ? ' / 要求 ' + ask + 's' : ''}</span>`;
}
function checkChip(r){
  const c = r.check; if (!c) return '';
  return c.errors ? `<span class="chip bad">check ${c.errors} 错</span>` : c.warnings ? `<span class="chip warn">check ${c.warnings} 警告</span>` : '<span class="chip ok">check 通过</span>';
}
function whoDot(r){ return `<span class="dot" style="background:${FAM[META.agents[r.agent].family]}"></span>`; }

/* ===== router: every screen is a URL, so back/forward and reload work ===== */
// #/overview?cond=all   #/compare?a=cc:bare&b=codex:bare   #/compare?mode=q&q=Q1&cond=all   #/run/<id>?f=all
function parse(){
  const h = location.hash.replace(/^#\/?/, '') || 'overview';
  const [path, qs] = h.split('?');
  const [view, id] = path.split('/');
  return {view: ['overview','compare','run'].includes(view) ? view : 'overview', id: id ? decodeURIComponent(id) : null, p: new URLSearchParams(qs || '')};
}
function href(view, params = {}, id){
  const qs = new URLSearchParams(Object.entries(params).filter(([,v]) => v != null && v !== '')).toString();
  return '#/' + view + (id ? '/' + encodeURIComponent(id) : '') + (qs ? '?' + qs : '');
}
function go(view, params, id, replace){
  const h = href(view, params, id);
  if (replace) { history.replaceState(null, '', h); render(); } else location.hash = h;
}
window.addEventListener('hashchange', render);

let lastRunView = null;           // remembered for the "单次运行" tab
function render(){
  if (!META) return;
  const {view, id, p} = parse();
  $$('#tabs a').forEach(a => {
    a.classList.toggle('on', a.dataset.v === view);
    a.href = a.dataset.v === 'run' ? (lastRunView || href('run', {}, (RUNS.find(r => r.media) || RUNS[0])?.id)) : href(a.dataset.v);
  });
  stopVideos();
  if (view === 'overview') renderOverview(p);
  else if (view === 'compare') renderCompare(p);
  else { lastRunView = location.hash; renderRun(id, p); }
  window.scrollTo(0, 0);
}
function stopVideos(){ $$('video').forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); }); }

/* ===== overview ===== */
function renderOverview(p){
  const cond = p.get('cond') || 'all';
  let h = `<div class="bar"><span class="muted">条件</span><span class="seg">${[['all','全部'],['bare','无 skill'],['hf','HyperFrames']].map(([k,l]) => `<a href="${href('overview',{cond:k==='all'?null:k})}" class="${cond===k?'on':''}">${l}</a>`).join('')}</span>
    <span class="muted" style="margin-left:auto;font-size:12.5px">鼠标在缩略图上横向移动可预览全片 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切换视图</span></div>`;
  const openSet = JSON.parse(localStorage.getItem("c2vOpen") || "{}");
  const isOpen = q => (q in openSet) ? openSet[q] : !META.queries[q].fold;
  const order = [...qids().filter(q => !META.queries[q].fold), ...qids().filter(q => META.queries[q].fold)];
  for (const q of order) {
    const Q = META.queries[q];

      <a class="cmp" href="${href('compare',{mode:'q',q, cond:cond==='all'?null:cond})}">这一题全部并排看 →</a></div></summary><div class="cards">`;
    for (const r of rs) {

        <div class="who">${whoDot(r)}<span>${esc(META.agents[r.agent].model)}</span><span class="cond">${esc(META.conds[r.cond])}</span></div>
        <div class="chips"><span class="chip ${sc}">${st}</span>${durChip(r)}${checkChip(r)}</div>
        <div class="stats"><span><b>${fmtT(r.secs)}</b></span><span><b>${r.n_tools}</b> 次调用${r.n_err ? ` <span style="color:var(--bad)">${r.n_err} 报错</span>` : ''}</span><span>${costName(r)} <b>${costOf(r)}</b></span></div>
        <div class="muted" style="font-size:12px">${esc(r.stack)}</div></div></a>`;
    }

  $('#app').innerHTML = h;
  $$('details.qsec').forEach(d => d.addEventListener('toggle', () => {
    const o = JSON.parse(localStorage.getItem("c2vOpen") || "{}"); o[d.dataset.q] = d.open; localStorage.setItem("c2vOpen", JSON.stringify(o));
  }));
  $$('.thumb[data-frames]').forEach(el => {
    const fr = JSON.parse(el.dataset.frames), img = el.querySelector('img'), bar = el.querySelector('.bar2'), orig = img.src;
    el.addEventListener('mousemove', e => { const b = el.getBoundingClientRect(), x = Math.min(.999, Math.max(0, (e.clientX - b.left) / b.width)); img.src = fr[Math.floor(x * fr.length)]; bar.style.width = x * 100 + '%'; });
    el.addEventListener('mouseleave', () => { img.src = orig; bar.style.width = 0; });
  });
}

function cfgOpts(sel){

    .map(k => { const [a,c] = k.split(':'); return `<option value="${k}" ${k===sel?'selected':''}>${esc(META.agents[a].model)} · ${esc(META.conds[c])}</option>`; }).join('');
}
function vbox(r, side, wins){

function renderCompare(p){

    const find = (k,q) => { const [ag,c] = k.split(':'); return RUNS.find(r => r.agent===ag && r.cond===c && r.q===q); };
    const votes = store.votes; let wa = 0, wb = 0, tie = 0;

      const t = lower(ra?.done ? ra.secs : null, rb?.done ? rb.secs : null), n = lower(ra?.n_tools, rb?.n_tools);

      $$(`[data-vote="${key}"]`).forEach(x => x.classList.toggle('on', vs[key] === x.dataset.v));
      const all = store.votes; let A=0,B=0,T=0; qids().forEach(q => { const v = all[pair+'|'+q]; if(v==='a')A++; else if(v==='b')B++; else if(v==='t')T++; });
      const bs = $$('.tally b'); bs[0].textContent = A; bs[1].textContent = T; bs[2].textContent = B;
    });
  }
  bindSync();
}
function bindSync(){
  const vids = () => $$('#app video');

function digest(d){ return d.runs.map(r => r.id + ':' + r.rev + ':' + (r.media ? 1 : 0)).join(','); }
let current = '', pending = null;
async function fetchIndex(){ return fetch('index.json?t=' + Date.now()).then(x => x.json()); }
function apply(d){
  $$('#roundSeg a').forEach(a => a.classList.toggle('on', a.dataset.r === (d.meta.round || 'r1')));
  META = d.meta; RUNS = d.runs; BYID = Object.fromEntries(RUNS.map(r => [r.id, r])); current = digest(d); summary();
}
async function poll(){
  if (!$('#live').classList.contains('on')) return;
  let d; try { d = await fetchIndex(); } catch { return; }
  if (digest(d) === current) return;
  const view = parse().view, playing = $$('video').some(v => !v.paused);
  if (view === 'overview' && !playing) { apply(d); render(); return; }
  pending = d;
  const newly = d.runs.filter(r => r.done).length - RUNS.filter(r => r.done).length;
  $('#toastMsg').textContent = newly > 0 ? `有 ${newly} 个运行刚结束` : '有新的进度';
  $('#toast').classList.add('on');
}
$('#toastBtn').onclick = () => { if (pending) { apply(pending); pending = null; render(); } $('#toast').classList.remove('on'); };
$('#live').onclick = () => $('#live').classList.toggle('on');
setInterval(poll, 60000);

fetchIndex().then(d => {
  apply(d);
  if (!location.hash) history.replaceState(null, '', href('overview'));
  if (parse().view !== 'run') sessionStorage.c2vBack = location.hash;
  render();
}).catch(() => { $('#app').innerHTML = '<div class="empty">数据加载失败：确认 index.json 存在，刷新重试</div>'; });
</script>
</body>
</html>
